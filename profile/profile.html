<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="../assets/favicon.png">
  <link rel="apple-touch-icon" href="../assets/favicon.png">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ocayur - Doctor Portal | Profile</title>
  <meta name="description" content="Ocayur Doctor Portal - View and manage doctor profile details.">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="../shared/dashboard.css">
  <link rel="stylesheet" href="profile.css">
</head>
<body>

  <!-- Page Loader Overlay -->
  <div class="page-loader-overlay" id="pageLoader" role="status" aria-live="polite">
    <div class="page-loader-card">
      <div class="page-loader-spinner"></div>
      <p class="page-loader-text">Loading profile...</p>
    </div>
  </div>

  <div class="app-layout">
    
    <!-- Mobile Top Navigation Bar -->
    <header class="mobile-topbar" aria-label="Mobile Navigation Bar">
      <button class="mobile-nav-toggle" id="mobileMenuBtn" aria-label="Toggle navigation menu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>

      <div class="mobile-brand">
        <img src="../assets/logo.svg" alt="Ocayur Logo" class="mobile-logo-img" width="100" height="40">
      </div>

      <a href="profile.html" class="mobile-user-avatar" aria-label="Doctor Profile" title="View Doctor Profile">
        <div class="avatar-circle small">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
          </svg>
        </div>
      </a>
    </header>

    <!-- Sidebar Overlay for Mobile Drawer -->
    <div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>

    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <a href="../dashboard/dashboard.html" class="sidebar-brand-link" aria-label="Ocayur Home">
          <img src="../assets/logo.svg" alt="Ocayur - Ayurveda Lifestyle" class="sidebar-logo-img" width="140" height="70">
        </a>
      </div>

      <nav class="sidebar-nav" aria-label="Main Navigation">
        <ul class="nav-list">
          
          <!-- Dashboard -->
          <li class="nav-item">
            <a href="../dashboard/dashboard.html" class="nav-link">
              <span class="nav-icon" aria-hidden="true">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                  <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
              </span>
              <span class="nav-text">Dashboard</span>
            </a>
          </li>

          <!-- My Patients -->
          <li class="nav-item">
            <a href="../patients/patients.html" class="nav-link">
              <span class="nav-icon" aria-hidden="true">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                  <circle cx="9" cy="7" r="4"></circle>
                  <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                  <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
              </span>
              <span class="nav-text">My Patients</span>
            </a>
          </li>

          <!-- Packages -->
          <li class="nav-item">
            <a href="../packages/packages.html" class="nav-link">
              <span class="nav-icon" aria-hidden="true">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="9" cy="21" r="1"></circle>
                  <circle cx="20" cy="21" r="1"></circle>
                  <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
              </span>
              <span class="nav-text">Packages</span>
            </a>
          </li>

          <!-- Appointments -->
          <li class="nav-item">
            <a href="../appointments/appointments.html" class="nav-link">
              <span class="nav-icon" aria-hidden="true">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
              </span>
              <span class="nav-text">Appointments</span>
            </a>
          </li>

          <!-- Courses -->
          <li class="nav-item">
            <a href="../courses/courses.html" class="nav-link">
              <span class="nav-icon" aria-hidden="true">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                  <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                </svg>
              </span>
              <span class="nav-text">Workshops</span>
            </a>
          </li>

        </ul>
      </nav>

      <!-- Sidebar Bottom Logout Button -->
      <div class="sidebar-footer">
        <a href="../index.html" class="logout-btn" id="logoutBtn" title="Log out of portal">
          <span class="logout-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
          </span>
          <span class="logout-text">Log out</span>
        </a>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      
      <!-- Top Page Header -->
      <header class="content-header">
        <div class="welcome-heading">
          <h1 class="page-title">Profile</h1>
          <p class="welcome-subtitle">Manage doctor profile details</p>
        </div>

        <!-- Doctor Profile Card Pill -->
        <a href="profile.html" class="doctor-profile-card" title="View Doctor Profile">
          <div class="avatar-circle">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
          </div>
          <div class="doctor-info">
            <span class="doctor-name">John Doe</span>
            <span class="doctor-role">Doctor</span>
          </div>
        </a>
      </header>

      <!-- Dashboard Main Body -->
      <div class="dashboard-body">

        <!-- Doctor Profile Form Card -->
        <section class="profile-card" aria-labelledby="profile-heading">
          <h2 id="profile-heading" class="visually-hidden">Doctor Profile</h2>

          <form id="profileForm" class="profile-form" novalidate>

            <!-- Profile Image Section -->
            <div class="profile-image-section">
              <span class="profile-field-label">Profile Image</span>
              <div class="profile-avatar-wrapper">
                <div class="profile-avatar-circle" id="profileAvatar" title="Profile picture">
                  <svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                  </svg>
                </div>
              </div>
            </div>

            <!-- Form Fields Grid (2 columns) -->
            <div class="profile-fields-grid">

              <!-- Row 1: Full Name / Date of Birth -->
              <div class="profile-field-group">
                <label for="profileFullName" class="profile-field-label">
                  Full Name <span class="required-star" aria-hidden="true">*</span>
                </label>
                <div class="profile-input-container">
                  <input 
                    type="text" 
                    id="profileFullName" 
                    name="fullName" 
                    class="profile-field-input" 
                    placeholder="e.g. Dr. Nidhi Jha"
                    required
                  >
                </div>
              </div>

              <div class="profile-field-group">
                <label for="profileDOB" class="profile-field-label">
                  Date of Birth <span class="required-star" aria-hidden="true">*</span>
                </label>
                <div class="profile-input-container">
                  <input 
                    type="date" 
                    id="profileDOB" 
                    name="dateOfBirth" 
                    class="profile-field-input" 
                    required
                  >
                </div>
              </div>

              <!-- Row 2: Phone Number / Gender -->
              <div class="profile-field-group">
                <label for="profilePhone" class="profile-field-label">
                  Phone Number <span class="required-star" aria-hidden="true">*</span>
                </label>
                <div class="profile-input-container">
                  <input 
                    type="tel" 
                    id="profilePhone" 
                    name="phoneNumber" 
                    class="profile-field-input" 
                    placeholder="e.g. 9876543210"
                    maxlength="10"
                    inputmode="numeric"
                    pattern="[0-9]{10}"
                    required
                  >
                </div>
              </div>

              <div class="profile-field-group">
                <label for="profileGender" class="profile-field-label">
                  Gender <span class="required-star" aria-hidden="true">*</span>
                </label>
                <div class="profile-input-container profile-select-container">
                  <select 
                    id="profileGender" 
                    name="gender" 
                    class="profile-field-input profile-field-select" 
                    required
                  >
                    <option value="" disabled selected>Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                  </select>
                </div>
              </div>

              <!-- Row 3: Email / YOE -->
              <div class="profile-field-group">
                <label for="profileEmail" class="profile-field-label">
                  Email <span class="required-star" aria-hidden="true">*</span>
                </label>
                <div class="profile-input-container">
                  <input 
                    type="email" 
                    id="profileEmail" 
                    name="email" 
                    class="profile-field-input" 
                    placeholder="doctor@gmail.com"
                    required
                  >
                </div>
              </div>

              <div class="profile-field-group">
                <label for="profileYOE" class="profile-field-label">
                  YOE (Years of Experience) <span class="required-star" aria-hidden="true">*</span>
                </label>
                <div class="profile-input-container">
                  <input 
                    type="number" 
                    id="profileYOE" 
                    name="yoe" 
                    class="profile-field-input" 
                    placeholder="e.g. 12"
                    min="0"
                    max="70"
                    required
                  >
                </div>
              </div>

              <!-- Row 4: Expertise / Area -->
              <div class="profile-field-group">
                <label for="profileExpertise" class="profile-field-label">
                  Expertise <span class="required-star" aria-hidden="true">*</span>
                </label>
                <div class="profile-input-container">
                  <input 
                    type="text" 
                    id="profileExpertise" 
                    name="expertise" 
                    class="profile-field-input" 
                    placeholder="e.g. Ayurveda Physician"
                    required
                  >
                </div>
              </div>

              <div class="profile-field-group">
                <label for="profileArea" class="profile-field-label">
                  Area <span class="required-star" aria-hidden="true">*</span>
                </label>
                <div class="profile-input-container">
                  <input 
                    type="text" 
                    id="profileArea" 
                    name="area" 
                    class="profile-field-input" 
                    placeholder="e.g. Pediatrics & Gynecology"
                    required
                  >
                </div>
              </div>

              <!-- Row 5: Registration Number / HPR Registration Number -->
              <div class="profile-field-group">
                <label for="profileRegNo" class="profile-field-label">
                  Registration Number <span class="required-star" aria-hidden="true">*</span>
                </label>
                <div class="profile-input-container">
                  <input 
                    type="text" 
                    id="profileRegNo" 
                    name="registrationNumber" 
                    class="profile-field-input" 
                    placeholder="e.g. AYU1234"
                    required
                  >
                </div>
              </div>

              <div class="profile-field-group">
                <label for="profileHPR" class="profile-field-label">
                  HPR Registration Number <span class="required-star" aria-hidden="true">*</span>
                </label>
                <div class="profile-input-container">
                  <input 
                    type="text" 
                    id="profileHPR" 
                    name="hprRegistrationNumber" 
                    class="profile-field-input" 
                    placeholder="e.g. HPR1234"
                    required
                  >
                </div>
              </div>

            </div>

            <!-- Update Button -->
            <div class="profile-form-actions">
              <button type="submit" class="profile-update-btn" id="profileUpdateBtn">Update</button>
            </div>

          </form>
        </section>

        <!-- Change Password Section Card -->
        <section class="profile-card change-password-card" aria-labelledby="change-password-heading">
          <h2 id="change-password-heading" class="change-password-title">Change Password</h2>

          <form id="changePasswordForm" class="profile-form change-password-form" novalidate>
            <div class="profile-fields-grid change-password-grid">

              <!-- Row 1: Old Password -->
              <div class="profile-field-group">
                <label for="oldPassword" class="profile-field-label">
                  Old Password <span class="required-star" aria-hidden="true">*</span>
                </label>
                <div class="profile-input-container password-input-container">
                  <input 
                    type="password" 
                    id="oldPassword" 
                    name="oldPassword" 
                    class="profile-field-input password-input" 
                    placeholder="••••••••"
                    required
                    autocomplete="current-password"
                  >
                  <button 
                    type="button" 
                    class="password-toggle-btn" 
                    data-target="oldPassword"
                    aria-label="Toggle Old Password visibility"
                    title="Show password"
                  >
                    <!-- Eye Off Icon (Default when hidden) -->
                    <svg class="eye-off-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                      <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                    <!-- Eye On Icon (Shown when revealed) -->
                    <svg class="eye-on-icon hidden" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"></path>
                      <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                  </button>
                </div>
              </div>

              <!-- Row 1 Right Column: Empty Spacer -->
              <div class="profile-field-group empty-spacer" aria-hidden="true"></div>

              <!-- Row 2: New Password / Confirm Password -->
              <div class="profile-field-group">
                <label for="newPassword" class="profile-field-label">
                  New Password <span class="required-star" aria-hidden="true">*</span>
                </label>
                <div class="profile-input-container password-input-container">
                  <input 
                    type="password" 
                    id="newPassword" 
                    name="newPassword" 
                    class="profile-field-input password-input" 
                    placeholder="••••••••"
                    required
                    autocomplete="new-password"
                  >
                  <button 
                    type="button" 
                    class="password-toggle-btn" 
                    data-target="newPassword"
                    aria-label="Toggle New Password visibility"
                    title="Show password"
                  >
                    <svg class="eye-off-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                      <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                    <svg class="eye-on-icon hidden" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"></path>
                      <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                  </button>
                </div>
              </div>

              <div class="profile-field-group">
                <label for="confirmPassword" class="profile-field-label">
                  Confirm Password <span class="required-star" aria-hidden="true">*</span>
                </label>
                <div class="profile-input-container password-input-container">
                  <input 
                    type="password" 
                    id="confirmPassword" 
                    name="confirmPassword" 
                    class="profile-field-input password-input" 
                    placeholder="••••••••"
                    required
                    autocomplete="new-password"
                  >
                  <button 
                    type="button" 
                    class="password-toggle-btn" 
                    data-target="confirmPassword"
                    aria-label="Toggle Confirm Password visibility"
                    title="Show password"
                  >
                    <svg class="eye-off-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                      <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                    <svg class="eye-on-icon hidden" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"></path>
                      <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                  </button>
                </div>
              </div>

            </div>

            <!-- Update Password Button -->
            <div class="profile-form-actions">
              <button type="submit" class="profile-update-btn" id="updatePasswordBtn">Update Password</button>
            </div>
          </form>
        </section>

      </div>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="../shared/api_config.js"></script>
  <script src="../shared/dashboard.js"></script>
</body>
</html>
